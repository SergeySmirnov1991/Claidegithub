<text x="930.0" y="36" font-size="22" text-anchor="middle" fill="#1a1a1a" font-weight="bold">АСУ ТП одноколонного штабелёра на базе Weintek — структурная схема</text>
<text x="930.0" y="58" font-size="12.5" text-anchor="middle" fill="#555" font-weight="normal">Контроллер cMT (CODESYS) · клиент-серверные панели на этажах · удалённый ввод-вывод iR · ПЧ · независимый контур безопасности</text>

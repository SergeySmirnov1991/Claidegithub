<text x="580.0" y="614" font-size="10.5" text-anchor="middle" fill="#333" font-weight="normal">двигатель вил,</text>
<text x="580.0" y="629" font-size="10.5" text-anchor="middle" fill="#333" font-weight="normal">энкодер</text>
<line x1="580" y1="528" x2="580" y2="572" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="710.0" y="572" width="227.0" height="110" rx="6" fill="#fff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="823.5" y="590" font-size="12" text-anchor="middle" fill="#1a1a1a" font-weight="bold">Входы (DI)</text>
<text x="720.0" y="608" font-size="9.5" text-anchor="start" fill="#333" font-weight="normal">SQna/b/c ×5 — датчики этажей</text>
<text x="720.0" y="623" font-size="9.5" text-anchor="start" fill="#333" font-weight="normal">SQ8.1…8.3 — положение вил</text>
<text x="720.0" y="638" font-size="9.5" text-anchor="start" fill="#333" font-weight="normal">BG0 — паллета на вилах</text>
<text x="720.0" y="653" font-size="9.5" text-anchor="start" fill="#333" font-weight="normal">BG1…5 — занятость мест</text>
<text x="720.0" y="668" font-size="9.5" text-anchor="start" fill="#333" font-weight="normal">SQ1.1…5.1 — закрытие ворот</text>
<line x1="823.5" y1="528" x2="823.5" y2="572" stroke="#7a2bbf" stroke-width="1.2" marker-end="url(#a)"/>
<rect x="953.0" y="572" width="227.0" height="110" rx="6" fill="#fff" stroke="#d40000" stroke-width="1.5"/>
<text x="1066.5" y="590" font-size="12" text-anchor="middle" fill="#d40000" font-weight="bold">Выходы (DO)</text>
<text x="963.0" y="608" font-size="9.5" text-anchor="start" fill="#333" font-weight="normal">YL1…YL5 — замки ворот</text>
<text x="963.0" y="623" font-size="9.5" text-anchor="start" fill="#333" font-weight="normal">Лампы/звук «занято»,</text>
<text x="963.0" y="638" font-size="9.5" text-anchor="start" fill="#333" font-weight="normal">«ворота открыты эт.N»</text>
<text x="963.0" y="653" font-size="9.5" text-anchor="start" fill="#333" font-weight="normal">Разрешение/индикация</text>
<text x="963.0" y="668" font-size="9.5" text-anchor="start" fill="#333" font-weight="normal">на панелях PU1…PU5</text>
<line x1="1066.5" y1="528" x2="1066.5" y2="572" stroke="#7a2bbf" stroke-width="1.2" marker-end="url(#a)"/>
<rect x="1480" y="282" width="330" height="470" rx="6" fill="#fff6f6" stroke="#d40000" stroke-width="2.5" stroke-dasharray="2 0"/>
<text x="1645.0" y="308" font-size="13" text-anchor="middle" fill="#d40000" font-weight="bold">Контур безопасности (независимый)</text>
<text x="1645.0" y="326" font-size="10.5" text-anchor="middle" fill="#a33" font-weight="normal">PL d / SIL 2 — аппаратный, не через ПЛК</text>
<rect x="1540" y="342" width="210" height="56" rx="6" fill="#ffecec" stroke="#d40000" stroke-width="2"/>
<text x="1645.0" y="364" font-size="12" text-anchor="middle" fill="#d40000" font-weight="bold">KSR — реле безопасности</text>
<text x="1645.0" y="382" font-size="10" text-anchor="middle" fill="#a33" font-weight="normal">(2-канальное, с самоконтролем)</text>
<text x="1500" y="424" font-size="11" text-anchor="start" fill="#d40000" font-weight="bold">Входы:</text>
<text x="1500" y="444" font-size="10" text-anchor="start" fill="#333" font-weight="normal">• SF1…SFn — кнопки «Авар. стоп»</text>
<line x1="1500" y1="440" x2="1496" y2="440" stroke="#d40000" stroke-width="1"/>
<text x="1500" y="461" font-size="10" text-anchor="start" fill="#333" font-weight="normal">• SQ1.1…SQ5.1 — концевики ворот (защ.)</text>
<line x1="1500" y1="457" x2="1496" y2="457" stroke="#d40000" stroke-width="1"/>
<text x="1500" y="478" font-size="10" text-anchor="start" fill="#333" font-weight="normal">• BL1…BL5 — лазерные сканеры (защ.)</text>
<line x1="1500" y1="474" x2="1496" y2="474" stroke="#d40000" stroke-width="1"/>
<text x="1500" y="495" font-size="10" text-anchor="start" fill="#333" font-weight="normal">• SQ0 / SQ9 — перебег по высоте</text>
<line x1="1500" y1="491" x2="1496" y2="491" stroke="#d40000" stroke-width="1"/>
<text x="1500" y="532" font-size="11" text-anchor="start" fill="#d40000" font-weight="bold">Выходы:</text>
<text x="1500" y="552" font-size="10" text-anchor="start" fill="#333" font-weight="normal">• STO → UZ1 и UZ2 (снятие момента)</text>
<text x="1500" y="569" font-size="10" text-anchor="start" fill="#333" font-weight="normal">• Размыкание питания тормоза YB1</text>
<text x="1500" y="586" font-size="10" text-anchor="start" fill="#333" font-weight="normal">• Сигнал «Безопасно» → контроллер A1</text>
<line x1="1480" y1="428" x2="360" y2="428" stroke="#d40000" stroke-width="1.8" stroke-dasharray="6 4"/>
<line x1="1480" y1="578" x2="1480" y2="428" stroke="#d40000" stroke-width="1.8" stroke-dasharray="6 4"/>
<line x1="310" y1="428" x2="310" y2="442" stroke="#d40000" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ar)"/>
<line x1="540" y1="428" x2="540" y2="442" stroke="#d40000" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ar)"/>
<text x="546" y="424" font-size="9.5" text-anchor="start" fill="#d40000" font-weight="normal">STO → оба ПЧ + тормоз YB1</text>
<rect x="40" y="1090" width="560" height="120" rx="6" fill="#fafafa" stroke="#888" stroke-width="1.5"/>
<text x="54" y="1114" font-size="13" text-anchor="start" fill="#1a1a1a" font-weight="bold">Обозначения связей</text>
<line x1="56" y1="1132" x2="100" y2="1132" stroke="#0050c8" stroke-width="2.5"/>
<text x="110" y="1136" font-size="11" text-anchor="start" fill="#1a1a1a" font-weight="normal">Ethernet / PoE (панели ↔ cMT-сервер)</text>
<line x1="56" y1="1150" x2="100" y2="1150" stroke="#7a2bbf" stroke-width="2.5"/>
<text x="110" y="1154" font-size="11" text-anchor="start" fill="#1a1a1a" font-weight="normal">EtherCAT / Modbus TCP (ввод-вывод, приводы)</text>
<line x1="56" y1="1168" x2="100" y2="1168" stroke="#1a1a1a" stroke-width="2.5"/>
<text x="110" y="1172" font-size="11" text-anchor="start" fill="#1a1a1a" font-weight="normal">Дискретные сигналы 24 В (DI/DO к полю)</text>
<line x1="56" y1="1186" x2="100" y2="1186" stroke="#d40000" stroke-width="2.5" stroke-dasharray="6 4"/>
<text x="110" y="1190" font-size="11" text-anchor="start" fill="#1a1a1a" font-weight="normal">Цепи безопасности (аппаратные, STO/тормоз)</text>
<rect x="640" y="1090" width="1180" height="120" rx="6" fill="#f4fbf6" stroke="#0a8f3c" stroke-width="1.5"/>
<text x="654" y="1114" font-size="13" text-anchor="start" fill="#0a8f3c" font-weight="bold">Ключевые функции АСУ ТП (по логике работы)</text>
<text x="654" y="1134" font-size="10" text-anchor="start" fill="#234" font-weight="normal">1. Вызов с панели любого этажа: контроллер фиксирует этаж-источник и этаж-назначения, строит маршрут.</text>
<text x="654" y="1149" font-size="10" text-anchor="start" fill="#234" font-weight="normal">2. Забор паллеты с места погрузки источника (по BGn), доставка на этаж назначения.</text>
<text x="654" y="1164" font-size="10" text-anchor="start" fill="#234" font-weight="normal">3. Если место выгрузки занято (BGn=1) — паллета НЕ выгружается, штабелёр только доезжает до этажа и сигналит.</text>
<text x="654" y="1179" font-size="10" text-anchor="start" fill="#234" font-weight="normal">4. При открытии ворот на ЛЮБОМ этаже (SQn.1) — немедленный СТОП; на ВСЕХ панелях индикация «открыты ворота эт. N».</text>
<text x="654" y="1194" font-size="10" text-anchor="start" fill="#234" font-weight="normal">5. Контур безопасности (аварийный стоп, ворота, сканеры, перебег) — аппаратный, со снятием момента и тормозом.</text>
</svg>
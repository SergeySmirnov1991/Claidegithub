<text x="232" y="394" font-size="12" text-anchor="start" fill="#7a2bbf" font-weight="bold">Полевая шина EtherCAT / Modbus TCP (ввод-вывод и приводы)</text>
<line x1="430.0" y1="368" x2="430.0" y2="402" stroke="#7a2bbf" stroke-width="2"/>
<rect x="250" y="442" width="200" height="86" rx="6" fill="#f0fbf3" stroke="#0a8f3c" stroke-width="2"/>
<text x="350.0" y="464" font-size="12" text-anchor="middle" fill="#0a8f3c" font-weight="bold">UZ1 — ПЧ подъёма</text>
<text x="350.0" y="484" font-size="10.5" text-anchor="middle" fill="#333" font-weight="normal">Векторный ПЧ + энкодер. карта</text>
<text x="350.0" y="499" font-size="10.5" text-anchor="middle" fill="#333" font-weight="normal">STO, торм. резистор</text>
<text x="350.0" y="514" font-size="10.5" text-anchor="middle" fill="#333" font-weight="normal">управление M1, тормоз YB1</text>
<line x1="350" y1="402" x2="350" y2="442" stroke="#7a2bbf" stroke-width="1.5"/>
<rect x="480" y="442" width="200" height="86" rx="6" fill="#f0fbf3" stroke="#0a8f3c" stroke-width="2"/>
<text x="580.0" y="464" font-size="12" text-anchor="middle" fill="#0a8f3c" font-weight="bold">UZ2 — ПЧ вил</text>
<text x="580.0" y="484" font-size="10.5" text-anchor="middle" fill="#333" font-weight="normal">Векторный ПЧ + энкодер. карта</text>
<text x="580.0" y="499" font-size="10.5" text-anchor="middle" fill="#333" font-weight="normal">STO</text>
<text x="580.0" y="514" font-size="10.5" text-anchor="middle" fill="#333" font-weight="normal">управление M2</text>
<line x1="580" y1="402" x2="580" y2="442" stroke="#7a2bbf" stroke-width="1.5"/>
<rect x="710" y="442" width="470" height="86" rx="6" fill="#f7f0fb" stroke="#7a2bbf" stroke-width="2"/>
<text x="945.0" y="462" font-size="13" text-anchor="middle" fill="#7a2bbf" font-weight="bold">Удалённый ввод-вывод Weintek iR</text>
<text x="724" y="482" font-size="10.5" text-anchor="start" fill="#333" font-weight="normal">iR-ETN40R — шинный соединитель (EtherCAT/Modbus TCP)</text>
<text x="724" y="498" font-size="10.5" text-anchor="start" fill="#333" font-weight="normal">iR-DI16-K ×N — дискретные входы (датчики)</text>
<text x="724" y="514" font-size="10.5" text-anchor="start" fill="#333" font-weight="normal">iR-DO16-P ×N — дискретные выходы (замки, индикация)</text>
<line x1="945.0" y1="402" x2="945.0" y2="442" stroke="#7a2bbf" stroke-width="1.5"/>
<text x="40" y="558" font-size="13" text-anchor="start" fill="#888" font-weight="bold">Полевые устройства</text>

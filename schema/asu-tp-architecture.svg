<text x="350.0" y="594" font-size="12" text-anchor="middle" fill="#1a1a1a" font-weight="bold">M1 + YB1 + BR1</text>
<text x="350.0" y="614" font-size="10.5" text-anchor="middle" fill="#333" font-weight="normal">двигатель подъёма,</text>
<text x="350.0" y="629" font-size="10.5" text-anchor="middle" fill="#333" font-weight="normal">тормоз, энкодер</text>

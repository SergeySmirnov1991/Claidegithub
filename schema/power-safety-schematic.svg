<text x="74" y="784" font-size="13" text-anchor="start" fill="#1a1a1a" font-weight="bold">Примечания</text>
<text x="74" y="806" font-size="9.5" text-anchor="start" fill="#234" font-weight="normal">• QF0 — главный выключатель; QF1, QF2 — защита ПЧ; QF3 — защита источника 24В (G1). Номиналы и сечения — по расчёту токов и длин кабелей.</text>
<text x="74" y="822" font-size="9.5" text-anchor="start" fill="#234" font-weight="normal">• Тормоз YB1 удерживает груз при обесточивании; контур безопасности через контактор KM1 снимает питание тормоза одновременно со STO обоих ПЧ.</text>
<text x="74" y="838" font-size="9.5" text-anchor="start" fill="#234" font-weight="normal">• STO обоих ПЧ и размыкание тормоза происходят при: аварийном стопе (SF), открытии любых ворот (SQn.1), срабатывании сканера (BLn), перебеге (SQ0/SQ9).</text>
<text x="74" y="854" font-size="9.5" text-anchor="start" fill="#234" font-weight="normal">• Концевики ворот SQn.1 и сканеры BLn заводятся двухканально: в реле KSR (останов) и в модули iR/ПЛК (логика работы и индикация этажа на панелях).</text>
<text x="74" y="870" font-size="9.5" text-anchor="start" fill="#234" font-weight="normal">• Энкодеры BR1/BR2 подключаются к энкодерным картам ПЧ. Категория остановки (0/1) и класс реле KSR уточняются по оценке рисков (ISO 13849 / IEC 62061).</text>
<text x="74" y="886" font-size="9.5" text-anchor="start" fill="#234" font-weight="normal">• Замки ворот YL1…YL5 и индикация — от выходов модулей Weintek iR (см. схему подключения io-wiring-diagram.svg).</text>
</svg>